<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#161a22"><link rel="manifest" href="manifest.webmanifest"><title>Pocket Piano</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#161a22;color:white;font:16px system-ui;overscroll-behavior:none}header{display:flex;align-items:center;justify-content:space-between;padding:12px;gap:8px}button{font:inherit;cursor:pointer}header button{background:#303746;border:0;color:white;border-radius:9px;padding:10px 14px}#oct{font-weight:700}#keyboard{position:relative;height:min(68vh,390px);margin:10px 12px;touch-action:none;user-select:none;-webkit-user-select:none;display:flex} .white{position:relative;flex:1;background:#f9fafb;border:1px solid #9098a4;border-radius:0 0 6px 6px;color:#555;display:flex;align-items:end;justify-content:center;padding-bottom:12px}.white.active{background:#bed7f8}.black{position:absolute;top:0;width:5.1%;height:61%;background:#17191e;border-radius:0 0 5px 5px;z-index:2;transform:translateX(-50%);box-shadow:0 3px 3px #0006}.black.active{background:#526f9a}small{color:#aeb7c5;display:block;text-align:center;padding:4px}
</style></head><body><header><button id="down" aria-label="Octave down">− Oct</button><span id="oct">C4–B5</span><button id="up" aria-label="Octave up">+ Oct</button></header><div id="keyboard"></div><small>Tap to play · Works offline after installation</small><div style="text-align:center"><button id="updates">Check for updates</button></div><small id="update-status" role="status" aria-live="polite"></small>
<script>
let base=60,ctx,master;const held=new Map(),keys=document.getElementById('keyboard');const names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
// Safari/iOS: treat the piano as media playback, including in Silent Mode.
function audio(){if(!ctx){try{if('audioSession'in navigator)navigator.audioSession.type='playback'}catch(error){/* Older browsers retain their default audio behavior. */}ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.22;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume()}
function start(id,midi,el){audio();stop(id);let t=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='triangle';osc.frequency.value=440*Math.pow(2,(midi-69)/12);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.55,t+.008);gain.gain.exponentialRampToValueAtTime(.16,t+.18);osc.connect(gain).connect(master);osc.start(t);held.set(id,{osc,gain,el,startedAt:t});el.classList.add('active')}
function stop(id){let v=held.get(id);if(!v)return;let t=ctx.currentTime,param=v.gain.gain;if(typeof param.cancelAndHoldAtTime==='function'){param.cancelAndHoldAtTime(t)}else{let age=Math.max(0,t-v.startedAt),level=age<.008?.55*age/.008:age<.18?.55*Math.pow(.16/.55,(age-.008)/.172):.16;param.cancelScheduledValues(t);param.setValueAtTime(level,t)}param.linearRampToValueAtTime(0,t+.04);v.osc.stop(t+.05);v.osc.onended=()=>{v.osc.disconnect();v.gain.disconnect()};v.el.classList.remove('active');held.delete(id)}
function render(){for(let id of [...held.keys()])stop(id);keys.innerHTML='';let whites=0;for(let i=0;i<24;i++){let midi=base+i,n=midi%12,black=[1,3,6,8,10].includes(n);let el=document.createElement('div');el.dataset.midi=midi;el.className=black?'black':'white';if(black){el.style.left=(whites/14*100)+'%'}else{el.textContent=names[n];whites++}keys.appendChild(el)}document.getElementById('oct').textContent=`C${base/12-1}–B${base/12}`}
function hit(e){let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-midi]');return el&&keys.contains(el)?el:null}
keys.addEventListener('pointerdown',e=>{let el=hit(e);if(el){e.preventDefault();keys.setPointerCapture(e.pointerId);start(e.pointerId,+el.dataset.midi,el)}});keys.addEventListener('pointermove',e=>{if(!held.has(e.pointerId))return;let el=hit(e),old=held.get(e.pointerId);if(el&&el!==old.el){stop(e.pointerId);start(e.pointerId,+el.dataset.midi,el)}});for(let event of ['pointerup','pointercancel','lostpointercapture'])keys.addEventListener(event,e=>stop(e.pointerId));document.getElementById('down').onclick=()=>{base=Math.max(24,base-12);render()};document.getElementById('up').onclick=()=>{base=Math.min(84,base+12);render()};document.addEventListener('visibilitychange',()=>{if(document.hidden)for(let id of [...held.keys()])stop(id)});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
document.getElementById('updates').onclick=async()=>{
 const button=document.getElementById('updates'),status=document.getElementById('update-status');
 button.disabled=true;status.textContent='Checking for updates…';
 try{
  if(!('serviceWorker'in navigator))throw Error('unsupported');
  const registration=await navigator.serviceWorker.getRegistration();
  if(!registration)throw Error('unavailable');
  await registration.update();
  // Refresh through the controlling worker so offline copies match the server.
  const worker=navigator.serviceWorker.controller||registration.active;
  if(!worker)throw Error('unavailable');
  await new Promise((resolve,reject)=>{
   const channel=new MessageChannel(),timer=setTimeout(()=>{channel.port1.close();reject(Error('timeout'))},15000);
   channel.port1.onmessage=e=>{clearTimeout(timer);channel.port1.close();e.data.ok?resolve():reject(Error('refresh failed'))};
   worker.postMessage({type:'CHECK_FOR_UPDATES'},[channel.port2]);
  });
  location.reload();
 }catch(error){status.textContent='Could not check for updates. Check your connection and try again.';button.disabled=false}
};
</script></body></html>
